<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Удалить книгу: {{ book.title }}</title>
</head>
<body>
    <h3>Вы уверены, что хотите удалить книгу "{{ book.title }}"?</h3>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
    </form>
    <br>
    <a href="{% url 'detail_book' book.id %}">Назад к книге</a>
</body>
</html>
